<!DOCTYPE html>
<html lang="es" data-themes="light,dark,aqua">
<head><meta charset="UTF-8"><title>Tests theme.js</title></head>
<body>
<script>try { localStorage.setItem('theme', 'dark'); } catch (e) {}</script>
<script src="../../tests/harness.js"></script>
<script src="../theme.js"></script>
<script>
// theme.js monta el botón al terminar de cargar: las comprobaciones van después.
document.addEventListener('DOMContentLoaded', () => {
  const btn = () => document.querySelector('.theme-toggle');
  const click = () => btn().click();

  test('el botón de tema existe', () => assert.ok(btn()));

  test('desde oscuro, el siguiente modo es aqua y tiene nombre e icono', () => {
    assert.eq(btn().getAttribute('aria-label'), 'Cambiar a modo aqua');
    assert.ok(btn().innerHTML.includes('<svg'), 'icono');
  });

  test('pulsar cicla a aqua, luego a claro y luego a oscuro', () => {
    click();
    assert.eq(document.documentElement.getAttribute('data-theme'), 'aqua');
    assert.eq(localStorage.getItem('theme'), 'aqua');
    click();
    assert.eq(document.documentElement.getAttribute('data-theme'), 'light');
    click();
    assert.eq(document.documentElement.getAttribute('data-theme'), 'dark');
  });

  test('el icono de aqua es distinto al de claro y oscuro', () => {
    const icons = {};
    ['dark', 'aqua', 'light'].forEach(() => { icons[btn().getAttribute('aria-label')] = btn().innerHTML; click(); });
    assert.eq(new Set(Object.values(icons)).size, 3);
  });

  try { localStorage.removeItem('theme'); } catch (e) {}
  finish();
});
</script>
</body>
</html>
