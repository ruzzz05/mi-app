<!DOCTYPE html>
<html lang="es" data-themes="light,dark,aqua,niebla">
<head><meta charset="UTF-8"><title>Tests theme.js</title></head>
<body>
<script>try { localStorage.setItem('theme', 'dark'); } catch (e) {}</script>
<script src="../../tests/harness.js"></script>
<script src="../theme.js"></script>
<script>
// theme.js monta el botón al terminar de cargar: las comprobaciones van después.
document.addEventListener('DOMContentLoaded', () => {
  const btn = () => document.querySelector('.theme-toggle');
  const click = () => btn().click();

  test('el botón de tema existe', () => assert.ok(btn()));

  test('desde oscuro, el siguiente modo es aqua y tiene nombre e icono', () => {
    assert.eq(btn().getAttribute('aria-label'), 'Cambiar a modo aqua');
    assert.ok(btn().innerHTML.includes('<svg'), 'icono');
  });

  test('pulsar cicla oscuro, aqua, niebla, claro y vuelve a oscuro', () => {
    ['aqua', 'niebla', 'light', 'dark'].forEach(m => {
      click();
      assert.eq(document.documentElement.getAttribute('data-theme'), m);
      assert.eq(localStorage.getItem('theme'), m);
    });
  });

  test('desde aqua, el siguiente modo es niebla con nombre propio', () => {
    click(); // aqua
    assert.eq(btn().getAttribute('aria-label'), 'Cambiar a modo niebla');
    click(); click(); click(); // niebla, claro, oscuro
  });

  test('cada modo tiene un icono distinto', () => {
    const icons = {};
    for (let i = 0; i < 4; i++) { icons[btn().getAttribute('aria-label')] = btn().innerHTML; click(); }
    assert.eq(Object.keys(icons).length, 4);
    assert.eq(new Set(Object.values(icons)).size, 4);
  });

  try { localStorage.removeItem('theme'); } catch (e) {}
  finish();
});
</script>
</body>
</html>
