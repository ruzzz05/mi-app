<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
         font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         background: #f6f5f2; color: #111; }
  a { color: inherit; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #0b0b0b; color: #f3f2ef; } }
</style>
<script>
  // Direcciones antiguas (de antes de ordenar el proyecto en carpetas) -> carpeta de cada app
  var moved = { 'vinilos.html': 'apps/vinilos/', 'ask.html': 'apps/ask/' };
  var file = location.pathname.split('/').pop();
  if (moved[file]) location.replace(location.pathname.slice(0, -file.length) + moved[file]);
</script>
</head>
<body>
  <main>
    <h1>Página no encontrada</h1>
    <p><a id="home" href="./">Volver al inicio</a></p>
  </main>
  <script>
    // Este archivo se sirve desde cualquier ruta: el enlace de inicio se calcula desde la raíz del sitio
    var parts = location.pathname.split('/');
    document.getElementById('home').href = (location.hostname.endsWith('github.io') ? '/' + parts[1] : '') + '/';
  </script>
</body>
</html>
