<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gimnasio</title>

<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi App">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="../../shared/styles.css">
<link rel="stylesheet" href="gym.css">
<script src="../../shared/auth.js"></script>
<script src="../../shared/palettecore.js"></script>
<script src="../../shared/palette.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="back" href="../../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Inicio
    </a>
    <span class="title">Gimnasio</span>
    <span class="topbar-actions">
      <button id="sync-now" class="theme-toggle" type="button" aria-label="Sincronizar ahora" title="Sincronizar ahora">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 00-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0014.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg>
      </button>
      <span class="spacer"></span>
    </span>
  </header>

  <div class="scroller">
    <main class="wrap">
      <section id="screen-hoy" class="hidden"></section>
      <section id="screen-rutinas" class="hidden"></section>
      <section id="screen-perfil" class="hidden"></section>
      <section id="screen-editar" class="hidden"></section>
      <section id="screen-usar" class="hidden"></section>
    </main>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="Secciones">
    <button type="button" data-screen="hoy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Hoy</span>
    </button>
    <button type="button" data-screen="rutinas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      <span>Rutinas</span>
    </button>
    <button type="button" data-screen="perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
      <span>Perfil</span>
    </button>
  </nav>

  <!-- Hoja inferior reutilizable -->
  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

<script src="gymcore.js"></script>
<script src="exercises.js"></script>
<script src="healthcore.js"></script>
<script src="google-config.js"></script>
<script src="../../shared/synccore.js"></script>
<script src="../../shared/syncbadge.js"></script>
<script src="core.js"></script>
<script src="screens/ejercicios.js"></script>
<script src="screens/editar.js"></script>
<script src="screens/usar.js"></script>
<script src="health.js"></script>
<script src="screens/hoy.js"></script>
<script src="screens/perfil.js"></script>
<script src="screens/rutinas.js"></script>
<script src="main.js"></script>
<script type="module" src="cloud.js"></script>
<script src="../../shared/pwa.js"></script>
</body>
</html>
