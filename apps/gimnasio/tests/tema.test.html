<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Tests colores por defecto del gimnasio</title>
<link rel="stylesheet" href="../gym.css"></head>
<body>
<script src="../../../tests/harness.js"></script>
<script>
// Los temas de color los pone shared/palette.js al cargar la página (se prueba en shared/tests).
// Aquí se comprueba solo que, sin tema elegido, gym.css define todos los colores que usa.
const v = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const VARS = ['--bg', '--surface', '--surface-2', '--ink', '--ink-2', '--ink-3', '--line', '--btn-bg', '--btn-ink',
  '--accent', '--accent-soft', '--tab-bg', '--tab-ink', '--tabbg', '--tabink', '--tabonbg', '--tabonink',
  '--ok', '--on-ok', '--lv0', '--lv1', '--lv2', '--lv3', '--lv4', '--shadow'];

test('sin tema elegido, gym.css define todas las variables de color', () => {
  VARS.forEach(n => assert.ok(v(n) !== '', 'falta ' + n));
});

test('el color por defecto es el del primer tema (negro y turquesa)', () => {
  assert.eq(v('--bg').toUpperCase(), '#0A0A0A');
  assert.eq(v('--accent').toUpperCase(), '#14E0D0');
});

test('los antiguos modos de color ya no cambian nada', () => {
  ['aqua', 'niebla', 'light', 'dark'].forEach(t => {
    document.documentElement.setAttribute('data-theme', t);
    assert.eq(v('--bg').toUpperCase(), '#0A0A0A');
  });
  document.documentElement.removeAttribute('data-theme');
});
finish();
</script>
</body>
</html>
