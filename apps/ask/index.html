<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ask</title>

<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi App">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="../../shared/styles.css">
<script src="../../shared/auth.js"></script>
<script src="../../shared/theme.js"></script>
<style>
  body { display: flex; flex-direction: column; }

  .stage {
    flex: 1;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Selector de modo */
  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 4px;
    background: var(--surface-2);
    border-radius: 999px;
  }
  .segmented button {
    appearance: none;
    border: 0;
    min-height: 44px;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-2);
    font: 600 13px var(--sans);
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
  }
  .segmented button.active {
    background: var(--btn-bg);
    color: var(--btn-ink);
  }

  /* Tarjeta */
  .card {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 28px 22px 24px;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  #mode-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -.01em;
    margin: 0;
  }

  .intensity { display: flex; align-items: center; gap: 10px; }
  .intensity label {
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .intensity select { width: 72px; min-height: 40px; padding-left: 14px; }

  /* Jugadores */
  #names-section { padding-top: 18px; }
  .add-row { display: flex; gap: 8px; }
  .add-row .btn { padding: 0 20px; font-size: 20px; line-height: 1; }
  #players-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
    min-height: 8px;
  }
  .player-tag {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink);
    font: 500 14px var(--sans);
    cursor: pointer;
    animation: rise .25s ease-out both;
  }
  .player-tag svg { width: 10px; height: 10px; color: var(--ink-3); }
  .hint { margin: 10px 0 0; font-size: 12px; color: var(--ink-3); }

  /* Pregunta */
  .question-wrap {
    flex: 1;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
  }
  #question {
    margin: 0;
    font-weight: 700;
    text-align: center;
    font-family: var(--serif);
    font-size: clamp(24px, 6.4vw, 32px);
    line-height: 1.3;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  #question .hl {
    font-style: italic;
    text-decoration: underline;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 5px;
  }
  #question .num {
    font-family: var(--sans);
    font-style: normal;
    font-weight: 700;
    text-decoration: none;
    padding: 0 .35em;
    border: 1.5px solid currentColor;
    border-radius: 8px;
    font-size: .85em;
  }

  .next { width: 100%; min-height: 54px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>

<body>
  <header class="topbar">
    <a class="back" href="../../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Inicio
    </a>
    <span class="title">Ask</span>
    <span class="spacer"></span>
  </header>

  <main class="stage">
    <div class="segmented" role="tablist">
      <button id="btn-yonunca" class="active" type="button" role="tab">Yo nunca</button>
      <button id="btn-ask" type="button" role="tab">Ask</button>
    </div>

    <section id="card-container" class="card rise">
      <div class="card-head">
        <h2 id="mode-title">Yo nunca</h2>
        <div id="intensity-wrapper" class="intensity hidden">
          <label for="intensity-select">Intensidad</label>
          <select id="intensity-select" class="field">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
      </div>

      <div id="names-section" class="hidden">
        <div class="add-row">
          <input type="text" id="new-name-input" class="field" placeholder="Añadir jugador" autocomplete="off" autocapitalize="words">
          <button id="btn-add-name" class="btn ghost" type="button" aria-label="Añadir jugador">+</button>
        </div>
        <div id="players-list"></div>
        <p class="hint">Toca un nombre para eliminarlo.</p>
      </div>

      <div class="question-wrap">
        <p id="question">Cargando preguntas...</p>
      </div>

      <button id="btn-next" class="btn next" type="button">Siguiente</button>
    </section>
  </main>

<script src="askcore.js"></script>
<script>
// Guardado en el móvil: los jugadores y lo que queda de cada baraja (para no repetir preguntas)
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};
const PLAYERS_KEY = 'ask.players';
const deckKey = mode => 'ask.deck.' + mode;
const lastShown = {};   // última pregunta que salió en cada modo

let currentMode = 'yonunca';
let yonuncaQuestions = [];
let askQuestions = [];
let players = AskCore.parsePlayers(store.get(PLAYERS_KEY));
let intensity = 2;
const ERR = "\u0000err:";

const btnYoNunca = document.getElementById('btn-yonunca');
const btnAsk = document.getElementById('btn-ask');
const btnNext = document.getElementById('btn-next');
const questionElement = document.getElementById('question');
const modeTitle = document.getElementById('mode-title');
const namesSection = document.getElementById('names-section');
const newNameInput = document.getElementById('new-name-input');
const btnAddName = document.getElementById('btn-add-name');
const playersList = document.getElementById('players-list');
const intensityWrapper = document.getElementById('intensity-wrapper');
const intensitySelect = document.getElementById('intensity-select');

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

intensitySelect.addEventListener('change', e => { intensity = parseInt(e.target.value); });

function renderPlayers() {
  store.set(PLAYERS_KEY, JSON.stringify(players));
  playersList.innerHTML = '';
  players.forEach((player, index) => {
    const tag = document.createElement('button');
    tag.type = 'button';
    tag.className = 'player-tag';
    tag.innerHTML = `${esc(player)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>`;
    tag.onclick = () => removePlayer(index);
    playersList.appendChild(tag);
  });
}

function addPlayer() {
  const name = newNameInput.value.trim();
  if (!name) return;
  players.push(name);
  newNameInput.value = '';
  renderPlayers();
  newNameInput.focus();
}

function removePlayer(index) {
  players.splice(index, 1);
  renderPlayers();
}

btnAddName.addEventListener('click', addPlayer);
newNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

async function fetchCSV(url) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const text = await response.text();
    return text.split('\n')
      .map(line => line.trim())
      .filter(line => line.length > 0 && !line.startsWith('//'));
  } catch (error) {
    console.error(`Error cargando ${url}:`, error);
    return [ERR + "No se encontró el archivo " + url];
  }
}

async function loadQuestions() {
  questionElement.textContent = "Leyendo preguntas...";
  const [a, b] = await Promise.all([fetchCSV('yonunca.csv'), fetchCSV('ask.csv')]);
  yonuncaQuestions = a;
  askQuestions = b;
  showRandomQuestion();
}

function switchMode(newMode) {
  currentMode = newMode;
  btnYoNunca.classList.toggle('active', newMode === 'yonunca');
  btnAsk.classList.toggle('active', newMode === 'ask');

  const isAsk = newMode === 'ask';
  modeTitle.textContent = isAsk ? 'Ask' : 'Yo nunca';
  namesSection.classList.toggle('hidden', !isAsk);
  intensityWrapper.classList.toggle('hidden', !isAsk);
  if (isAsk) renderPlayers();

  showRandomQuestion();
}

function showRandomQuestion() {
  const questions = currentMode === 'yonunca' ? yonuncaQuestions : askQuestions;

  if (!questions || questions.length === 0) {
    questionElement.textContent = 'No hay preguntas disponibles.';
    return;
  }
  if (questions[0].startsWith(ERR)) {
    questionElement.textContent = questions[0].slice(ERR.length);
    return;
  }

  questionElement.classList.remove('rise');

  // Sale de la baraja: no se repite ninguna hasta que han salido todas
  const mode = currentMode;
  let saved = null;
  try { saved = JSON.parse(store.get(deckKey(mode))); } catch (e) { /* baraja rota: se baraja de nuevo */ }
  const card = AskCore.draw(Array.isArray(saved) ? saved : [], questions.length, lastShown[mode], Math.random);
  lastShown[mode] = card.index;
  store.set(deckKey(mode), JSON.stringify(card.deck));

  setTimeout(() => {
    let q = questions[card.index];

    if (currentMode === 'ask' && q.includes('{name}')) {
      const nameCount = (q.match(/{name}/g) || []).length;
      if (players.length < nameCount) {
        questionElement.textContent = `Faltan nombres: necesito ${nameCount} jugador${nameCount > 1 ? 'es' : ''}.`;
        questionElement.classList.add('rise');
        return;
      }
    }

    q = esc(q);

    if (currentMode === 'ask' && players.length > 0 && q.includes('{name}')) {
      const shuffled = [...players].sort(() => Math.random() - 0.5);
      let i = 0;
      q = q.replace(/{name}/g, () => `<span class="hl">${esc(shuffled[i++])}</span>`);
    }

    q = q.replace(/{int(\s*[+\-]\s*\d+)?}/g, (m, op) => {
      let result = intensity;
      if (op) {
        const clean = op.replace(/\s/g, '');
        const n = parseInt(clean.substring(1));
        result += clean[0] === '+' ? n : -n;
      }
      if (result < 1) result = 1;
      return `<span class="hl num">${result}</span>`;
    });

    q = q.replace(/\*(.*?)\*/g, '<span class="hl">$1</span>');

    questionElement.innerHTML = q;
    questionElement.classList.add('rise');
  }, 120);
}

btnYoNunca.addEventListener('click', () => switchMode('yonunca'));
btnAsk.addEventListener('click', () => switchMode('ask'));
btnNext.addEventListener('click', showRandomQuestion);

document.addEventListener('DOMContentLoaded', loadQuestions);
</script>
<script src="../../shared/pwa.js"></script>
</body>
</html>
