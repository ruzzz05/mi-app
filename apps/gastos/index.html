<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gastos</title>

<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi App">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0A">

<link rel="stylesheet" href="../../shared/styles.css">
<link rel="stylesheet" href="gastos.css">
<script src="../../shared/auth.js"></script>
<script src="../../shared/palettecore.js"></script>
<script src="../../shared/palette.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="back" href="../../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Inicio
    </a>
    <span class="title">Gastos</span>
    <span class="topbar-actions"><span class="spacer"></span></span>
  </header>

  <div class="scroller">
    <main class="wrap">
      <section id="screen-resumen"></section>
      <section id="screen-subs" class="hidden"></section>
      <section id="screen-auto" class="hidden"></section>
      <section id="screen-ajustes" class="hidden"></section>
    </main>
  </div>

  <div class="dock-fade" aria-hidden="true"></div>
  <nav id="dock" class="dock" aria-label="Secciones">
    <button type="button" data-screen="resumen" aria-label="Resumen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    </button>
    <button type="button" data-screen="subs" aria-label="Suscripciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 00-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0014.5 4.5L20 16M20 20v-4h-4"/></svg>
    </button>
    <button id="dock-add" class="plus" type="button" aria-label="Apuntar un gasto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" data-screen="auto" aria-label="Pagos automáticos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>
      <span class="badge" hidden></span>
    </button>
    <button type="button" data-screen="ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    </button>
  </nav>

  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

<script src="gastoscore.js"></script>
<script src="core.js"></script>
<script src="screens/resumen.js"></script>
<script src="screens/subs.js"></script>
<script src="screens/auto.js"></script>
<script src="screens/ajustes.js"></script>
<script src="main.js"></script>
<script type="module" src="inbox.js"></script>
<script src="../../shared/pwa.js"></script>
</body>
</html>
