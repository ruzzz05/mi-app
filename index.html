<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi App</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi App">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="styles.css">
<style>
  .home {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  .home header { margin-bottom: 40px; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 14px;
  }
  .home h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(40px, 12vw, 56px);
    line-height: 1.02;
    letter-spacing: -.02em;
    margin: 0;
  }
  .menu { display: grid; gap: 14px; }
  .tile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 24px 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .tile:active { transform: scale(.985); border-color: var(--ink); }
  .tile h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 26px;
    margin: 0 0 4px;
  }
  .tile p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .tile svg { flex: none; width: 22px; height: 22px; color: var(--ink-3); }
  .tile:nth-child(2) { animation-delay: .06s; }
</style>
</head>
<body>
  <main class="home">
    <header class="rise">
      <p class="eyebrow">Colección personal</p>
      <h1>Mi App</h1>
    </header>

    <nav class="menu" aria-label="Aplicaciones">
      <a class="tile rise" href="vinilos.html">
        <div>
          <h2>Vinilos</h2>
          <p>Mi biblioteca de discos, por artista y estilo.</p>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </a>

      <a class="tile rise" href="ask.html">
        <div>
          <h2>Ask</h2>
          <p>Preguntas para el grupo: Yo nunca y Ask.</p>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </nav>
  </main>

<script src="pwa.js"></script>
</body>
</html>
