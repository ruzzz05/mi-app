<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi App</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi App">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="shared/styles.css">
<script src="shared/theme.js"></script>
<style>
  .home {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  .home header { margin-bottom: 40px; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 14px;
  }
  .home h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(40px, 12vw, 56px);
    line-height: 1.02;
    letter-spacing: -.01em;
    margin: 0;
  }
  .menu { display: grid; gap: 14px; }
  .tile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 24px 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .tile:active { transform: scale(.985); border-color: var(--ink); }
  .tile h2 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 4px;
  }
  .tile p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .tile svg { flex: none; width: 22px; height: 22px; color: var(--ink-3); }
  .tile .dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    margin-left: 8px;
    vertical-align: middle;
  }

  .social {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .social a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-2);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: color .15s ease, border-color .15s ease, transform .12s ease;
  }
  .social a:active { color: var(--ink); border-color: var(--ink); transform: scale(.97); }
  .social svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <main class="home">
    <header class="rise">
      <p class="eyebrow">Colección personal</p>
      <h1>Mi App</h1>
    </header>

    <nav class="menu" id="menu" aria-label="Aplicaciones"></nav>

    <footer class="social rise">
      <a href="https://github.com/ruzzz05" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        <span>GitHub</span>
      </a>
      <a href="https://www.linkedin.com/in/miguel-ruz-garcia-2b4465368" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        <span>LinkedIn</span>
      </a>
    </footer>
  </main>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

// El menú se construye a partir de apps.json: añade o quita entradas allí.
fetch('apps.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(apps => {
    document.getElementById('menu').innerHTML = apps.map((app, i) => `
      <a class="tile rise" style="animation-delay:${i * 0.06}s" href="${esc(app.path)}">
        <div>
          <h2>${esc(app.name)}${app.accent ? `<span class="dot" style="background:${esc(app.accent)}"></span>` : ''}</h2>
          <p>${esc(app.description || '')}</p>
        </div>
        ${CHEVRON}
      </a>`).join('');
  })
  .catch(() => {
    document.getElementById('menu').innerHTML = '<p style="color:var(--ink-3)">No se pudo cargar la lista de aplicaciones.</p>';
  });
</script>
<script src="shared/pwa.js"></script>
</body>
</html>
